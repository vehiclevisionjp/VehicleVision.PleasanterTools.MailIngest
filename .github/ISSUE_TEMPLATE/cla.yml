name: CLA への署名
description: 本ツールへの貢献の許諾を届け出る
title: "CLA への署名: "
body:
  - type: markdown
    attributes:
      value: |
        住所やメールアドレスなどの個人情報は記入しないでください。
        **法人として署名する場合は、この Issue に加えて、署名者の権限を確認できるメールを `group.development+cla@vehiclevision.jp` へ送ってください**（詳しくは CONTRIBUTING.md の「CLA へ署名する」）。
  - type: input
    id: login
    attributes:
      label: GitHub ログイン名
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 署名種別
      options:
        - 個人
        - 法人（法人の同意と代表権限も確認する）
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: 同意
      options:
        - label: 正式化された CLA.md を読み同意し、貢献を許諾する権利を持っています
          required: true
