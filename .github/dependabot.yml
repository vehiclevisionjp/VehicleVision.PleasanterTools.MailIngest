# npm と NuGet の更新は自動では行わない（2026-11-16 に patch 自動更新を廃止した）。
# 人が必要なときにまとめて更新する。脆弱性は dependency-audit.yml（npm-audit・nuget-audit）と dependency-review.yml が検知する。
# ここに置くのは GitHub Actions の更新だけ（Actions の版は NOTICE・ロックファイルに関係しない）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
